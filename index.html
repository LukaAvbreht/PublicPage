<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luka Avbreht</title>
<meta name="description" content="Luka Avbreht — CEO and co-founder of AFLabs, CTO of Flare.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://avbreht.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Ctext x='16' y='21.5' font-family='system-ui,sans-serif' font-size='14' font-weight='600' fill='%23fff' text-anchor='middle'%3ELA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa;
    --fg: #18181b;
    --muted: #71717a;
    --rule: #d4d4d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --fg: #ececee;
      --muted: #a1a1aa;
      --rule: #3f3f46;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 30rem; }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .role { margin-top: 0.4rem; color: var(--muted); }
  .role span { white-space: nowrap; }
  nav {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
  }
  dl {
    margin-top: 1.1rem;
    display: grid;
    grid-template-columns: max-content 1fr;
    align-items: center;
    gap: 0.1rem 1rem;
  }
  dt { color: var(--muted); }
  dd {
    margin: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  dd span { min-width: 0; overflow-wrap: anywhere; }
  a {
    color: var(--fg);
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
    transition: text-decoration-color 0.15s;
  }
  a:hover, a:focus-visible { text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }
  .copy {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .copy:hover { color: var(--fg); border-color: var(--rule); }
  .copy:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .copy svg { width: 15px; height: 15px; }
  .copy .done, .copy.copied .icon { display: none; }
  .copy.copied .done { display: block; }
  .copy.copied { color: var(--fg); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <h1>Luka Avbreht</h1>
  <p class="role">
    <span>CEO and co-founder of <a href="https://aflabs.com" target="_blank" rel="noopener">AFLabs</a></span> ·
    <span>CTO of <a href="https://flare.network" target="_blank" rel="noopener">Flare</a></span>
  </p>
  <nav aria-label="Profiles">
    <a href="https://github.com/LukaAvbreht" target="_blank" rel="me noopener">GitHub</a>
    <a href="https://gitlab.com/LukaAvbreht" target="_blank" rel="me noopener">GitLab</a>
    <a href="https://www.linkedin.com/in/luka-avbreht-301995/" target="_blank" rel="me noopener">LinkedIn</a>
    <a href="https://x.com/LAvbreht" target="_blank" rel="me noopener">X</a>
  </nav>
  <dl aria-label="Email">
    <dt>Personal</dt>
    <dd><span>l.avbreht@gmail.com</span><button class="copy" type="button" data-copy="l.avbreht@gmail.com" aria-label="Copy l.avbreht@gmail.com" title="Copy"></button></dd>
    <dt>AFLabs</dt>
    <dd><span>luka.avbreht@aflabs.com</span><button class="copy" type="button" data-copy="luka.avbreht@aflabs.com" aria-label="Copy luka.avbreht@aflabs.com" title="Copy"></button></dd>
    <dt>Flare</dt>
    <dd><span>luka@flare.network</span><button class="copy" type="button" data-copy="luka@flare.network" aria-label="Copy luka@flare.network" title="Copy"></button></dd>
  </dl>
  <p class="sr-only" aria-live="polite" id="copy-status"></p>
</main>
<script>
  (function () {
    var icons =
      '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>' +
      '<svg class="done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M3 8.5l3 3 7-7"/></svg>';
    var status = document.getElementById('copy-status');

    function fallbackCopy(text) {
      var t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('readonly', '');
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
    }

    document.querySelectorAll('.copy').forEach(function (btn) {
      btn.innerHTML = icons;
      btn.addEventListener('click', function () {
        var text = btn.getAttribute('data-copy');
        var done = function () {
          btn.classList.add('copied');
          btn.title = 'Copied';
          status.textContent = 'Copied ' + text;
          clearTimeout(btn._t);
          btn._t = setTimeout(function () {
            btn.classList.remove('copied');
            btn.title = 'Copy';
          }, 1500);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        } else {
          fallbackCopy(text);
          done();
        }
      });
    });
  })();
</script>
</body>
</html>
